<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ဘုရားရှိခိုး</title>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --accent: #ff9800;
            --text-dark: #212121;
            --text-muted: #757575;
            --bg-light: #f8f9fa;
            --success: #2e7d32;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--primary);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: filter 0.2s linear;
        }

        /* --- UI Header --- */
        header {
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-bottom: 1px solid #eee;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .header-logo { display: flex; align-items: center; gap: 10px; }
        .app-logo { width: 32px; height: 32px; object-fit: contain; }
        .app-title { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .btn-icon { background: none; border: none; font-size: 24px; cursor: pointer; color: #444; display: flex; align-items: center; }

        /* --- Dropdown Menu --- */
        .dropdown {
            position: absolute; top: 60px; right: 15px;
            background: white; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border-radius: 12px; width: 220px; display: none;
            flex-direction: column; z-index: 2000; overflow: hidden;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .menu-item { padding: 15px 20px; border-bottom: 1px solid #f5f5f5; font-size: 0.95rem; cursor: pointer; }
        .menu-item:active { background: #fff3e0; }

        /* --- Content List --- */
        .container { flex: 1; padding: 15px; overflow-y: auto; background: var(--bg-light); padding-bottom: 80px; }
        .list-card {
            background: #fff; margin-bottom: 12px; padding: 18px;
            border-radius: 16px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer;
            border: 1px solid #f0f0f0; transition: var(--transition);
            animation: cardFadeIn 0.5s ease backwards;
        }
        @keyframes cardFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .list-card:active { transform: scale(0.97); background: #fafafa; }
        .b-icon { font-size: 1.2rem; color: var(--accent); }

        /* --- Detail Page --- */
        .full-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 3000; display: none; flex-direction: column;
        }
        .page-header { padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid #eee; }
        .detail-body { flex: 1; padding: 25px 20px; overflow-y: auto; text-align: center; line-height: 1.8; white-space: pre-line; }
        .page-footer-info { padding: 12px; text-align: center; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid #eee; }

        /* --- Ko-Na-Win System --- */
        .knw-item { background: #fff; margin-bottom: 10px; border-radius: 12px; border: 1px solid #eee; overflow: hidden; }
        .knw-trigger { 
            padding: 16px; display: flex; align-items: center; 
            justify-content: space-between; cursor: pointer; font-weight: bold;
        }
        .knw-table-box { display: none; padding: 10px; background: #fffcf5; justify-content: center; }
        .knw-table { 
            width: 100%; max-width: 500px; border-collapse: collapse; 
            font-size: 0.85rem; transform-origin: top center; transition: transform 0.2s;
        }
        .knw-table th, .knw-table td { padding: 10px 5px; border: 1px solid #ddd; text-align: center; }
        .row-active { background-color: var(--success) !important; color: white !important; font-weight: bold; }
        .row-active td { color: white !important; }
        .knw-controls { display: flex; justify-content: flex-end; gap: 15px; padding: 5px 15px; background: #fff; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 65px;
            background: white; border-top: 1px solid #eee;
            display: flex; justify-content: space-around; align-items: center; z-index: 3500;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: #666; cursor: pointer; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }

        /* --- Dialog Overlay --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 5000;
        }
        .dialog { background: white; width: 85%; max-width: 320px; padding: 25px; border-radius: 20px; text-align: center; }
        input[type="range"] { width: 100%; margin: 15px 0; accent-color: var(--accent); }

        .alarm-card { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
        .fav-active { color: #f44336 !important; }
    </style>
</head>
<body id="app-body">

    <header id="main-header">
        <div class="header-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Buddhist_flag.svg/200px-Buddhist_flag.svg.png" class="app-logo" alt="Flag">
            <span class="app-title">ဘုရားရှိခိုး</span>
        </div>
        <button class="btn-icon" onclick="toggleMenu(event)">☰</button>
    </header>

    <div class="dropdown" id="dropdown-menu">
        <div class="menu-item" onclick="openTool('bright')">💡 Bright Light</div>
        <div class="menu-item" onclick="showFavorites()">⭐ ကိုယ့်အကြိုက်</div>
        <div class="menu-item" onclick="openTool('alarm')">⏰ Alarm ထည့်ရန်</div>
        <div class="menu-item" onclick="alert('ဘုရားရှိခိုး App v1.0\nPure JS Web App')">ℹ️ App အကြောင်း</div>
        <div class="menu-item" onclick="window.location.href='mailto:zawmyokyithar.zmkt@gmail.com'">📧 အကြံပြုချက်ပို့ရန်</div>
    </div>

    <main class="container" id="list-view"></main>

    <div id="detail-page" class="full-page">
        <div class="page-header">
            <button class="btn-icon" onclick="closePage('detail-page')">←</button>
            <h4 id="dt-title" style="flex:1; text-align:center; font-size:1rem; margin:0 10px;"></h4>
            <div style="display:flex; gap:12px;">
                <button id="fav-trigger" class="btn-icon">☆</button>
                <button class="btn-icon" onclick="openTool('font')">A+</button>
            </div>
        </div>
        <div class="detail-body" id="dt-body"></div>
        <div class="page-footer-info" id="dt-counter"></div>
    </div>

    <div id="konawin-page" class="full-page">
        <div class="page-header">
            <button class="btn-icon" onclick="closePage('konawin-page')">←</button>
            <h4 style="flex:1; text-align:center;">ကိုးနဝင်း</h4>
            <div style="display:flex; gap:10px;">
                <button class="btn-icon" onclick="scaleTable(0.1)">➕</button>
                <button class="btn-icon" onclick="scaleTable(-0.1)">➖</button>
            </div>
        </div>
        <div class="container" id="knw-list"></div>
        <div style="padding: 10px; text-align: center; background: white;">
            <p style="color: var(--success); font-size: 0.85rem; font-weight: bold;">
                *အစိမ်းရောင်ဖြင့်ဖော်ပြထားသောရက်သည် သားသတ်လွှတ်စားရန်ဖြစ်ပါသည်*
            </p>
        </div>
        <div class="bottom-nav">
            <div class="nav-item active" onclick="closePage('konawin-page')">
                <span class="nav-icon">🏠</span><span>ပင်မ</span>
            </div>
            <div class="nav-item" onclick="alert('ပြီးမြှောက်မှုမှတ်တမ်း (Coming Soon)')">
                <span class="nav-icon">✅</span><span>ပြီးမြှောက်မှု</span>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeOverlay()">
        <div class="dialog" id="dialog-content" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        /** 1. Data Object (Database) **/
        const dhamaData = [
            { id: 0, title: "ရှိခိုးဦးချကန်တော့နည်း", body: "နမော တဿ ဘဂဝတော အရဟတော သမ္မာသမ္ဗုဒ္ဓဿ..." },
            { id: 1, title: "အပယ်ဖျက်", body: "အပါယ်လေးပါးမှ ကင်းဝေးစေသော ဂါထာတော်များ..." },
            { id: 2, title: "မိမိကိုယ်ကို မေတ္တာပို့", body: "အဟံ သုခိတော ဟောမိ၊ နိဒ္ဒုက္ခော ဟောမိ..." },
            { id: 3, title: "ဩကာသကန်တော့်ချိုး", body: "ဩကာသ ဩကာသ ဩကာသ၊ ကာယကံ ဝစီကံ မနောကံ..." },
            { id: 4, title: "ငါးပါးသီလတောင်ခံခြင်း", body: "အဟံ ဘန္တေ တိသရဏေန သဟ ပဉ္စသီလံ ဓမ္မံ ယာစာမိ..." },
            { id: 5, title: "သရဏဂုံဆောက်တည်ခြင်း", body: "ဗုဒ္ဓံ သရဏံ ဂစ္ဆာမိ၊ ဓမ္မံ သရဏံ ဂစ္ဆာမိ..." },
            { id: 6, title: "ငါးပါးသီလ", body: "ပါဏာတိပါတာ ဝေရမဏိ သိက္ခာပဒံ သမာဒိယာမိ..." },
            { id: 7, title: "ဘုရားဂုဏ်တော်", body: "ဣတိပိသော ဘဂဝါ အရဟံ သမ္မာသမ္ဗုဒ္ဓေါ..." },
            { id: 8, title: "တရားဂုဏ်တော်", body: "သွာက္ခာတော ဘဂဝတာ ဓမ္မော သန္ဒိဋ္ဌိကော..." },
            { id: 9, title: "သံဃာဂုဏ်တော်", body: "သုပ္ပဋိပန္နော ဘဂဝတော သာဝကသံဃော..." },
            { id: 10, title: "နတ်ပင့်", body: "သမန္တာ စက္ကဝါဠေသု အတြာဂစ္ဆန္တု ဒေဝတာ..." },
            { id: 11, title: "မေတ္တာသုတ်", body: "ယဿာနုဘာဝတော ယက္ခာ၊ နေဝ ဒဿေန္တိ ဘီသနံ..." },
            { id: 12, title: "ခွင့်တောင်း", body: "တရားဟော တရားနာ ခွင့်တောင်းခြင်း..." },
            { id: 13, title: "တရားနာဖိတ်", body: "ဓမ္မဿဝနကာလော အယံ ဘဒ္ဒန္တ..." },
            { id: 14, title: "ဖယ်ရှား", body: "ဘေးဥပဒ်အန္တရာယ်များ ဖယ်ရှားခြင်းဂါထာ..." },
            { id: 15, title: "အဓိဌာန်ဝင် စုံပေါက်/စုံပွင့်", body: "အဓိဌာန်ဝင်ခြင်းဆိုင်ရာ လမ်းညွှန်ချက်များ..." },
            { id: 16, title: "ပြန်လည်ဖိတ်ကြား", body: "နတ်ဗြဟ္မာများကို ပြန်လည်ဖိတ်ကြားခြင်း..." },
            { id: 17, title: "ယောဆရာတော်ဘုရားကြီး သစ္စာပြုဆုတောင်း", body: "သစ္စာပြု ဆုတောင်းဂါထာတော်..." },
            { id: 18, title: "နတ်ပို့", body: "ဧတ္တာဝတာ စ အမှေဟိ သမ္ဘတံ ပုညသမ္ပဒံ..." },
            { id: 19, title: "ကိုးနဝင်း", type: "KONAWIN" }
        ];

        const knwLevels = [
            { name: "ပထမအဆင့်", activeRow: 4, data: [["တနင်္လာ","သမ္မာသမ္ဗုဒ္ဓေါ","၂ ပတ်"],["အင်္ဂါ","ဘဂဝါ","၉ ပတ်"],["ဗုဒ္ဓဟူး","သုဂတော","၄ ပတ်"],["ကြာသပတေး","သတ္ထာဒေဝမနုဿာနံ","၇ ပတ်"],["သောကြာ","လောကဝိဒူ","၅ ပတ်"],["စနေ","ဝိဇ္ဇာစရဏသမ္ပန္နော","၃ ပတ်"],["တနင်္ဂနွေ","အနုတ္တရောပုရိသ ဒမ္မသာရထိ","၆ ပတ်"],["တနင်္လာ","အရဟံ","၁ ပတ်"],["အင်္ဂါ","ဗုဒ္ဓေါ","၈ ပတ်"]] },
            { name: "ဒုတိယအဆင့်", activeRow: 4, data: [["ဗုဒ္ဓဟူး","ဝိဇ္ဇာစရဏသမ္ပန္နော","၃ ပတ်"],["ကြာသပတေး","အရဟံ","၁ ပတ်"],["သောကြာ","လောကဝိဒူ","၅ ပတ်"],["စနေ","ဗုဒ္ဓေါ","၈ ပတ်"],["တနင်္ဂနွေ","အနုတ္တရောပုရိသ ဒမ္မသာရထိ","၆ ပတ်"],["တနင်္လာ","သုဂတော","၄ ပတ်"],["အင်္ဂါ","သတ္ထာဒေဝမနုဿာနံ","၇ ပတ်"],["ဗုဒ္ဓဟူး","သမ္မာသမ္ဗုဒ္ဓေါ","၂ ပတ်"],["ကြာသပတေး","ဘဂဝါ","၉ ပတ်"]] }
        ];

        let favorites = JSON.parse(localStorage.getItem('favs')) || [];
        let alarms = JSON.parse(localStorage.getItem('alarms')) || [];
        let currentIdx = 0;
        let tableScale = 1.0;

        /** 2. Core Functions **/
        function renderList(dataArr) {
            const container = document.getElementById('list-view');
            container.innerHTML = '';
            dataArr.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'list-card';
                card.style.animationDelay = `${idx * 0.05}s`;
                card.innerHTML = `<span class="b-icon">📖</span> <b>${item.title}</b>`;
                card.onclick = () => item.type === "KONAWIN" ? openKonawin() : openDetail(item.id);
                container.appendChild(card);
            });
        }

        function openDetail(id) {
            currentIdx = id;
            const item = dhamaData.find(d => d.id === id);
            document.getElementById('dt-title').innerText = item.title;
            document.getElementById('dt-body').innerText = item.body;
            document.getElementById('dt-counter').innerText = `${id + 1} / ${dhamaData.length - 1}`;
            updateFavUI();
            document.getElementById('detail-page').style.display = 'flex';
        }

        function openKonawin() {
            const container = document.getElementById('knw-list');
            container.innerHTML = knwLevels.map((lvl, i) => `
                <div class="knw-item">
                    <div class="knw-trigger" onclick="toggleTable(${i})">
                        <span>📖 ${lvl.name}</span> <span id="arr-${i}">▼</span>
                    </div>
                    <div class="knw-table-box" id="box-${i}">
                        <table class="knw-table" id="table-${i}">
                            <tr><th>နေ့ရက်</th><th>ဂုဏ်တော်</th><th>အကြိမ်ရေ</th></tr>
                            ${lvl.data.map((r, ri) => `<tr class="${ri === lvl.activeRow ? 'row-active' : ''}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
                        </table>
                    </div>
                </div>
            `).join('');
            document.getElementById('konawin-page').style.display = 'flex';
        }

        function toggleTable(idx) {
            const box = document.getElementById(`box-${idx}`);
            const arr = document.getElementById(`arr-${idx}`);
            const isOpen = box.style.display === 'flex';
            box.style.display = isOpen ? 'none' : 'flex';
            arr.innerText = isOpen ? '▼' : '▲';
        }

        function scaleTable(val) {
            tableScale += val;
            document.querySelectorAll('.knw-table').forEach(t => t.style.transform = `scale(${tableScale})`);
        }

        /** 3. Logic & Tools **/
        function toggleMenu(e) { e.stopPropagation(); const m = document.getElementById('dropdown-menu'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
        
        function openTool(type) {
            const overlay = document.getElementById('overlay');
            const content = document.getElementById('dialog-content');
            overlay.style.display = 'flex';
            document.getElementById('dropdown-menu').style.display = 'none';

            if (type === 'bright') {
                content.innerHTML = `<h4>💡 Bright Light</h4><input type="range" min="30" max="100" value="100" oninput="document.body.style.filter='brightness('+this.value+'%)'">`;
            } else if (type === 'font') {
                content.innerHTML = `<h4>A+ စာလုံးအရွယ်အစား</h4><input type="range" min="16" max="40" value="18" oninput="document.getElementById('dt-body').style.fontSize=this.value+'px'">`;
            } else if (type === 'alarm') { renderAlarmUI(); }
        }

        function renderAlarmUI() {
            const content = document.getElementById('dialog-content');
            content.innerHTML = `
                <h4>⏰ Alarm ထည့်ရန်</h4>
                <input type="text" id="al-title" placeholder="ခေါင်းစဉ်" style="width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #ddd;">
                <input type="time" id="al-time" style="width:100%; padding:10px; margin-top:5px; border-radius:8px; border:1px solid #ddd;">
                <button onclick="saveAlarm()" style="width:100%; padding:12px; background:var(--accent); border:none; color:white; border-radius:10px; margin-top:10px; font-weight:bold;">သိမ်းမည်</button>
                <div id="alarm-list-box">${alarms.map((a, i) => `<div class="alarm-card"><span>${a.title}<br><small>${a.time}</small></span><span onclick="delAlarm(${i})" style="color:red">🗑️</span></div>`).join('')}</div>
            `;
        }

        function saveAlarm() {
            const t = document.getElementById('al-title').value;
            const h = document.getElementById('al-time').value;
            if(!t || !h) return;
            alarms.push({title:t, time:h});
            localStorage.setItem('alarms', JSON.stringify(alarms));
            renderAlarmUI();
        }

        function delAlarm(i) { alarms.splice(i, 1); localStorage.setItem('alarms', JSON.stringify(alarms)); renderAlarmUI(); }

        function toggleFavorite() {
            if (favorites.includes(currentIdx)) favorites = favorites.filter(id => id !== currentIdx);
            else favorites.push(currentIdx);
            localStorage.setItem('favs', JSON.stringify(favorites));
            updateFavUI();
        }

        function updateFavUI() {
            const btn = document.getElementById('fav-trigger');
            btn.innerText = favorites.includes(currentIdx) ? '★' : '☆';
            btn.classList.toggle('fav-active', favorites.includes(currentIdx));
        }

        function showFavorites() {
            const favData = dhamaData.filter(d => favorites.includes(d.id));
            if (favData.length === 0) return alert("ကိုယ့်အကြိုက် မှတ်ထားတာ မရှိသေးပါ");
            renderList(favData);
            document.getElementById('dropdown-menu').style.display = 'none';
        }

        /** 4. Swipe & UI Handlers **/
        let touchX = 0;
        document.getElementById('dt-body').addEventListener('touchstart', e => touchX = e.touches[0].clientX);
        document.getElementById('dt-body').addEventListener('touchend', e => {
            let diff = touchX - e.changedTouches[0].clientX;
            if (diff > 80 && currentIdx < dhamaData.length - 2) openDetail(currentIdx + 1);
            if (diff < -80 && currentIdx > 0) openDetail(currentIdx - 1);
        });

        function closePage(id) { document.getElementById(id).style.display = 'none'; if(id === 'detail-page') renderList(dhamaData); }
        function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }
        document.getElementById('fav-trigger').onclick = toggleFavorite;
        window.onclick = () => document.getElementById('dropdown-menu').style.display = 'none';

        // Init
        renderList(dhamaData);
    </script>
</body>
</html>
